<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Proof detail</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Proof detail</b><span class="tag">approve · react</span><span class="num">S09</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">Jordan's proof</div></div>
    <div class="body fade-b">
      <div style="display:flex;gap:9px;align-items:center;"><div class="av"><svg><use href="#i-user"/></svg></div><div class="grow"><div class="h">Jordan · Meal prep</div><span class="sub">Today, 7:02am · Early Risers</span></div></div>
      <div class="ph-img" style="width:100%;height:200px;"><svg style="width:34px;height:34px;"><use href="#i-img"/></svg></div>

      <div class="card flat" style="display:flex;align-items:center;gap:10px;">
        <span class="pill y">🍵 Pending your approval</span>
        <div class="grow-sp"></div>
        <span class="sub">2 of 4 approved</span>
      </div>
      <div style="display:flex;gap:8px;">
        <div class="btn block ic" style="color:var(--bad);"><svg style="color:var(--bad)"><use href="#i-x"/></svg> Reject</div>
        <div class="btn primary block ic"><svg><use href="#i-check"/></svg> Approve</div>
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:9px;">
        <span class="flabel">React</span>
        <div class="rx"><div class="on">🔥</div><div>👏</div><div>💪</div><div>❤️</div><div>🎉</div></div>
      </div>
      <div class="input" style="justify-content:space-between;">Add a comment… <span class="pill">Send</span></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
