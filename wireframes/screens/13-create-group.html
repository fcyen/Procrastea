<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Create group</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Create group</b><span class="tag">create</span><span class="num">S13</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-x"/></svg></div><div class="title">New group</div></div>
    <div class="body fade-b">
      <div style="display:flex;gap:12px;align-items:center;">
        <div class="ph-img" style="width:56px;height:56px;border-radius:16px;"><svg style="width:22px;height:22px;"><use href="#i-img"/></svg></div>
        <div class="field grow-sp"><span class="flabel">Group name</span><div class="input">6am Club</div></div>
      </div>
      <div class="rowc"><div class="grow"><span class="flabel">Friends approve proof</span><span class="sub">A completion counts once approved</span></div><div class="toggle acc on"></div></div>
      <div class="field"><span class="flabel">Privacy</span>
        <div class="chips"><span class="chip on">Private</span><span class="chip">Invite link</span><span class="chip">Public</span></div>
      </div>
      <div class="field"><span class="flabel">Add members</span>
        <div class="input" style="gap:8px;color:var(--muted);"><svg style="width:15px;height:15px;color:var(--muted)"><use href="#i-search"/></svg> Search friends</div>
      </div>
      <div class="rowc"><div class="av sm"><svg><use href="#i-user"/></svg></div><div class="grow"><div class="ln w50"></div></div><div class="check on"><svg><use href="#i-check"/></svg></div></div>
      <div class="rowc"><div class="av sm"><svg><use href="#i-user"/></svg></div><div class="grow"><div class="ln w40"></div></div><div class="check on"><svg><use href="#i-check"/></svg></div></div>
      <div class="grow-sp"></div>
      <div class="btn primary block">Create group</div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
