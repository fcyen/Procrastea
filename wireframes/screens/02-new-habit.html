<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — New Habit (pick a template)</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>New habit — pick</b><span class="tag">create · step 1</span><span class="num">S02</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-x"/></svg></div><div class="title">New habit</div></div>
    <div class="body fade-b">
      <div class="input" style="gap:8px;color:var(--muted);"><svg style="width:16px;height:16px;color:var(--muted)"><use href="#i-search"/></svg> Search habits</div>
      <div class="sub" style="margin:-2px 0 2px;">Start from a template, or build your own</div>
      <div class="hgrid">
        <div class="tmpl"><div class="thumb">🏃</div><div class="name">Run daily</div></div>
        <div class="tmpl"><div class="thumb">📚</div><div class="name">Read</div></div>
        <div class="tmpl"><div class="thumb">💧</div><div class="name">Drink water</div></div>
        <div class="tmpl"><div class="thumb">🧘</div><div class="name">Meditate</div></div>
        <div class="tmpl"><div class="thumb">✍️</div><div class="name">Journal</div></div>
        <div class="tmpl"><div class="thumb">🥗</div><div class="name">Eat healthy</div></div>
        <div class="tmpl"><div class="thumb">😴</div><div class="name">Sleep early</div></div>
        <div class="tmpl new"><div class="thumb"><svg style="width:26px;height:26px;"><use href="#i-plus"/></svg></div><div class="name">Custom habit</div></div>
      </div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
