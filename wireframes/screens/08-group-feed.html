<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Group feed</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Group feed</b><span class="tag">setlog-style + approve</span><span class="num">S08</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-users"/></svg></div><div class="title">Early Risers</div><div class="ibtn f"><svg><use href="#i-plus"/></svg></div></div>
    <div class="body np" style="gap:0;">
      <div style="padding:10px 14px 8px;"><div class="chips"><span class="chip on">Early Risers</span><span class="chip">Gym Buddies</span><span class="chip">Book Club</span></div></div>

      <div style="padding:0 14px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden;">

        <!-- Pending your approval -->
        <div class="setcard">
          <div class="top">
            <div class="av"><svg><use href="#i-user"/></svg></div>
            <div class="grow"><div class="h" style="font-size:12.5px;">Jordan</div><span class="sub">logged Meal prep · 12m ago</span></div>
            <span class="pill y">🍵 needs proof</span>
          </div>
          <div class="proof"><svg><use href="#i-img"/></svg><span class="stamp wait"><svg><use href="#i-bell"/></svg> Pending</span></div>
          <div class="approvebar">
            <div class="tallybtn reject"><svg><use href="#i-x"/></svg> Reject</div>
            <div class="tallybtn approve"><svg><use href="#i-check"/></svg> Approve proof</div>
          </div>
        </div>

        <!-- Already approved -->
        <div class="setcard">
          <div class="top">
            <div class="av"><svg><use href="#i-user"/></svg></div>
            <div class="grow"><div class="h" style="font-size:12.5px;">Sam</div><span class="sub">logged Morning run · 2h ago</span></div>
            <span class="pill"><svg><use href="#i-check"/></svg> 3/4 approved</span>
          </div>
          <div class="proof" style="height:132px;"><svg><use href="#i-img"/></svg><span class="stamp ok"><svg><use href="#i-check"/></svg> Approved</span></div>
          <div class="foot">
            <div class="reacts">
              <span class="rc on">🔥 4</span><span class="rc">👏 6</span><span class="rc">💪 2</span>
            </div>
            <div class="grow-sp"></div>
            <div class="btn sm ghost ic"><svg><use href="#i-heart"/></svg> React</div>
          </div>
        </div>

      </div>
    </div>

    <div class="tabbar">
      <div class="tab"><svg><use href="#i-cup"/></svg><span>Home</span></div>
      <div class="tab on"><svg><use href="#i-users"/></svg><span>Group</span></div>
      <div class="tab"><div class="fab"><svg><use href="#i-cam"/></svg></div></div>
      <div class="tab"><svg><use href="#i-chart"/></svg><span>Stats</span></div>
      <div class="tab"><svg><use href="#i-gear"/></svg><span>Settings</span></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
