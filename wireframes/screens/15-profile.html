<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Edit profile</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Profile</b><span class="tag">edit profile</span><span class="num">S15</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">Edit profile</div><span class="pill" style="margin-left:auto;">Save</span></div>
    <div class="body fade-b">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0;">
        <div class="av lg"><svg><use href="#i-user"/></svg></div>
        <span class="pill">Change photo</span>
      </div>
      <div class="field"><span class="flabel">Display name</span><div class="input" style="color:var(--ink)">Alex Rivera</div></div>
      <div class="field"><span class="flabel">Username</span><div class="input" style="color:var(--ink)">@alexr</div></div>
      <div class="field"><span class="flabel">Bio</span><div class="input area" style="color:var(--ink)">Trying to run more and read more 🍵</div></div>
      <div class="field"><span class="flabel">Interests</span>
        <div class="chips"><span class="chip on">Running</span><span class="chip on">Reading</span><span class="chip on">Meditation</span><span class="chip">＋ Add</span></div>
      </div>
      <div class="divide"></div>
      <div class="row"><div class="grow"><div class="h">Manage groups</div><span class="sub">Groups you belong to</span></div><svg style="width:16px;height:16px;color:var(--muted)"><use href="#i-fwd"/></svg></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
