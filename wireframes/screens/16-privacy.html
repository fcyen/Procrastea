<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Privacy</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Privacy</b><span class="tag">settings</span><span class="num">S16</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">Privacy</div></div>
    <div class="body">
      <div class="h">Profile visibility</div>
      <div class="rowc"><div class="grow"><div class="h">Everyone</div><span class="sub">Anyone can find your profile</span></div><div class="radio"></div></div>
      <div class="rowc" style="border-color:var(--green);"><div class="grow"><div class="h">Friends only</div><span class="sub">Only friends see your activity</span></div><div class="radio on"></div></div>
      <div class="rowc"><div class="grow"><div class="h">Private</div><span class="sub">Nobody but you</span></div><div class="radio"></div></div>
      <div class="divide" style="margin:4px 0;"></div>
      <div class="rowc"><div class="grow"><div class="h">Sync with contacts</div><span class="sub">Find friends from your phone</span></div><div class="toggle on"></div></div>
      <div class="rowc"><div class="grow"><div class="h">Allow friend requests</div><span class="sub">From people you may know</span></div><div class="toggle on"></div></div>
      <div class="rowc"><div class="grow"><div class="h">Show streak on shared cards</div></div><div class="toggle"></div></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
