<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Customize habit</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Customize habit</b><span class="tag">create · step 2</span><span class="num">S03</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">New habit</div></div>
    <div class="body fade-b">
      <div class="field"><span class="flabel">Habit name</span><div class="input">Morning run</div></div>
      <div class="field">
        <span class="flabel">Cover photo</span>
        <span class="sub" style="margin-top:-2px;">Pick a photo that visualizes your end goal</span>
        <div class="upload"><svg style="width:22px;height:22px;color:var(--muted)"><use href="#i-img"/></svg> Upload file</div>
      </div>
      <div class="field"><span class="flabel">Repeat</span>
        <div class="days"><span class="day on">M</span><span class="day on">T</span><span class="day on">W</span><span class="day on">T</span><span class="day on">F</span><span class="day">S</span><span class="day">S</span></div>
      </div>
      <div class="rowc"><div class="grow"><span class="flabel">Require photo proof</span><span class="sub">Log this habit with a photo</span></div><div class="toggle acc on"></div></div>
      <div class="field"><span class="flabel">Share to group</span><div class="input" style="justify-content:space-between;color:var(--ink);">Early Risers <svg style="width:16px;height:16px;color:var(--muted)"><use href="#i-fwd"/></svg></div></div>
      <div class="grow-sp"></div>
      <div class="btn primary block">Add habit</div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
