<!DOCTYPE html>
<html lang="en">
<head>

    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>

      <div class="field"><div class="input" style="color:var(--ink);justify-content:space-between;">alex@email.com <svg style="width:15px;height:15px;color:var(--muted)"><use href="#i-mail"/></svg></div></div>
      <div class="btn block ghost">Update email</div>
      <div class="divide" style="margin:4px 0;"></div>
      <div class="h">Password</div>

      <div class="field"><span class="flabel">New password</span><div class="input">••••••••</div></div>

      <div class="grow-sp"></div>
      <div class="row" style="justify-content:center;color:var(--bad);gap:7px;"><svg style="width:15px;height:15px;"><use href="#i-trash"/></svg><span style="font-size:12px;font-weight:700;">Delete account</span></div>
    </div>
  </div></div>
