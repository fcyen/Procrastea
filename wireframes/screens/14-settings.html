<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Settings</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Settings</b><span class="tag">hub</span><span class="num">S14</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar plain"><div class="title">Settings</div></div>
    <div class="body">
      <div class="rowc"><div class="av" style="width:48px;height:48px;"><svg style="width:24px;height:24px;"><use href="#i-user"/></svg></div><div class="grow"><div class="h">Alex Rivera</div><span class="sub">@alexr · 8 friends</span></div><svg style="width:16px;height:16px;color:var(--muted)"><use href="#i-fwd"/></svg></div>
      <div style="display:flex;flex-direction:column;">
        <div class="row"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-user"/></svg></div><div class="grow"><div class="ln w40"></div></div><span class="sub">Profile</span></div>
        <div class="divide"></div>
        <div class="row"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-lock"/></svg></div><div class="grow"><div class="ln w50"></div></div><span class="sub">Privacy</span></div>
        <div class="divide"></div>
        <div class="row"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-bell"/></svg></div><div class="grow"><div class="ln w40"></div></div><span class="sub">Notifications</span></div>
        <div class="divide"></div>
        <div class="row"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-mail"/></svg></div><div class="grow"><div class="ln w50"></div></div><span class="sub">Account</span></div>
        <div class="divide"></div>
        <div class="row"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-users"/></svg></div><div class="grow"><div class="ln w40"></div></div><span class="sub">Groups &amp; friends</span></div>
      </div>
      <div class="grow-sp"></div>
      <div class="btn block ghost" style="color:var(--bad);">Log out</div>
    </div>
    <div class="tabbar">
      <div class="tab"><svg><use href="#i-cup"/></svg><span>Home</span></div>
      <div class="tab"><svg><use href="#i-users"/></svg><span>Group</span></div>
      <div class="tab"><div class="fab"><svg><use href="#i-cam"/></svg></div></div>
      <div class="tab"><svg><use href="#i-chart"/></svg><span>Stats</span></div>
      <div class="tab on"><svg><use href="#i-gear"/></svg><span>Settings</span></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
