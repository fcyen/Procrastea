<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Add friend</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Add friend</b><span class="tag">search / QR</span><span class="num">S11</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">Add friend</div></div>
    <div class="body">
      <div class="input" style="gap:8px;color:var(--muted);"><svg style="width:16px;height:16px;color:var(--muted)"><use href="#i-search"/></svg> Search by username</div>
      <div class="row" style="padding:8px 2px;"><div class="av sm"><svg><use href="#i-user"/></svg></div><div class="grow"><div class="ln w50"></div><span class="sub">@teahabit</span></div><span class="pill">Add</span></div>
      <div style="display:flex;align-items:center;gap:10px;margin:4px 0;"><div class="divide" style="flex:1"></div><span class="sub">or</span><div class="divide" style="flex:1"></div></div>
      <div class="card" style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;">
        <span class="flabel">Your QR code</span>
        <div class="qr"><svg><use href="#i-qr"/></svg></div>
        <span class="sub">Friends scan this to add you instantly</span>
      </div>
      <div class="grow-sp"></div>
      <div class="btn block ghost ic"><svg style="width:16px;height:16px;"><use href="#i-qr"/></svg> Scan a QR code</div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
