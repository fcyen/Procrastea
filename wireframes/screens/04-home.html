<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Home</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Home</b><span class="tag">dashboard</span><span class="num">S04</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar plain"><div class="title" style="font-size:22px;font-weight:800;letter-spacing:-.02em;">Procrastea</div><div class="ibtn f"><svg><use href="#i-bell"/></svg></div></div>
    <div class="body">
      <div class="stats">
        <div class="stat"><div class="n">2/3</div><div class="l">habits done</div></div>
        <div class="stat"><div class="n">19</div><div class="l">days streak</div></div>
        <div class="stat"><div class="n">90%</div><div class="l">completion rate</div></div>
      </div>

      <div class="h">Today's habits</div>
      <div class="hstrip">
        <div class="habit-card done">
          <div class="thumb"><svg><use href="#i-img"/></svg><span class="badge"><svg><use href="#i-check"/></svg></span></div>
          <div class="name">Run daily</div>
        </div>
        <div class="habit-card">
          <div class="thumb"><span class="todo">Track<br>now!</span></div>
          <div class="name">Write journal</div>
        </div>
        <div class="habit-card">
          <div class="thumb"><span class="todo">Track<br>now!</span></div>
          <div class="name">Read</div>
        </div>
      </div>

      <div class="h" style="margin-top:2px;">Friend's recent activity</div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;gap:9px;align-items:center;">
          <div class="av"><svg><use href="#i-user"/></svg></div>
          <div class="grow"><span class="sub" style="color:var(--ink);font-size:11.5px;line-height:1.4;">Jordan just tracked the habit <b>“Meal prep”</b>. View and approve his tracking now!</span></div>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="btn sm ghost block ic"><svg><use href="#i-img"/></svg> View proof</div>
          <div class="btn sm primary block ic"><svg><use href="#i-check"/></svg> Approve</div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab on"><svg><use href="#i-cup"/></svg><span>Home</span></div>
      <div class="tab"><svg><use href="#i-users"/></svg><span>Group</span></div>
      <div class="tab"><div class="fab"><svg><use href="#i-cam"/></svg></div></div>
      <div class="tab"><svg><use href="#i-chart"/></svg><span>Stats</span></div>
      <div class="tab"><svg><use href="#i-gear"/></svg><span>Settings</span></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
