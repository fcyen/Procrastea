<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Notifications</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Notifications</b><span class="tag">settings</span><span class="num">S17</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">Notifications</div></div>
    <div class="body">
      <div class="rowc"><div class="grow"><div class="h">Enable notifications</div><span class="sub">Master switch</span></div><div class="toggle on"></div></div>
      <div class="h">Channels</div>
      <div class="rowc"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-mail"/></svg></div><div class="grow"><div class="h">Email</div></div><div class="toggle"></div></div>
      <div class="rowc"><div class="av sm" style="border-radius:8px;"><svg><use href="#i-bell"/></svg></div><div class="grow"><div class="h">Push notification</div></div><div class="toggle on"></div></div>
      <div class="h">Notify me about</div>
      <div class="rowc"><div class="grow"><div class="h">Friend activity &amp; reactions</div></div><div class="toggle on"></div></div>
      <div class="rowc"><div class="grow"><div class="h">Habit reminders</div></div><div class="toggle on"></div></div>
      <div class="rowc"><div class="grow"><div class="h">Proof approvals</div></div><div class="toggle on"></div></div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
