<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Which habit are you tracking?</title>
<link rel="stylesheet" href="../assets/wireframe.css">
</head>
<body class="solo">
<figure class="device">
  <div class="cap"><b>Which habit?</b><span class="tag">log · step 2</span><span class="num">S06</span></div>
  <div class="phone"><div class="screen">
    <div class="sb"><span>9:41</span><span class="r"><svg viewBox="0 0 24 12"><rect x="0" y="1" width="20" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="3" width="15" height="6" rx="1"/><rect x="21" y="4" width="2" height="4" rx="1"/></svg></span></div>
    <div class="appbar"><div class="ibtn"><svg><use href="#i-back"/></svg></div><div class="title">Which habit are you tracking?</div></div>
    <div class="body">
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div class="ph-img" style="width:130px;height:158px;"><svg style="width:34px;height:34px;"><use href="#i-img"/></svg></div>
        <div class="btn sm ghost ic" style="padding:6px 16px;"><svg><use href="#i-retake"/></svg> Retake</div>
      </div>
      <div class="input" style="gap:8px;color:var(--muted);margin-top:2px;"><svg style="width:16px;height:16px;color:var(--muted)"><use href="#i-search"/></svg> Search by habit name…</div>
      <div class="rowc" style="border-color:var(--green);background:var(--green-tint);"><span style="font-size:20px;">🏃</span><div class="grow"><div class="h">Run daily</div><span class="sub">19 day streak · due today</span></div><div class="radio on"></div></div>
      <div class="rowc"><span style="font-size:20px;">✍️</span><div class="grow"><div class="h">Write journal</div><span class="sub">Due today</span></div><div class="radio"></div></div>
      <div class="grow-sp"></div>
      <div style="display:flex;gap:8px;">
        <div class="btn ghost block ic"><svg><use href="#i-plus"/></svg> Add habit</div>
        <div class="btn primary block">Track it</div>
      </div>
    </div>
  </div></div>
</figure>
<script src="../assets/sprite.js"></script>
</body>
</html>
