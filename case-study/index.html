<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Design Process (case study)</title>
<meta name="description" content="Procrastea — the AI-assisted design process, as a scrollable slide deck.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --matcha:#a0d286; --matcha-deep:#84bd67; --matcha-ink:#4c7d33; --matcha-tint:#eaf5e2;
    --honey:#f6c343; --charcoal:#20252d; --ink-2:#565f6b; --muted:#9aa2ad;
    --line:#e2e5ea; --porcelain:#fafbfc;
    --bar-h:56px;
    font-family:"Figtree",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  html{scroll-behavior:smooth;scroll-padding-top:var(--bar-h);}
  body{background:var(--porcelain);color:var(--charcoal);-webkit-font-smoothing:antialiased;}

  /* brand bar */
  .bar{position:sticky;top:0;z-index:10;height:var(--bar-h);display:flex;align-items:center;gap:12px;
    padding:0 20px;background:rgba(250,251,252,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .bar .mk{width:26px;height:26px;background:var(--matcha-tint);border-radius:8px;display:grid;place-items:center;flex:none;}
  .bar .mk svg{width:17px;height:17px;}
  .bar .brand{font-weight:800;letter-spacing:-.01em;}
  .bar .brand .tea{color:var(--matcha-ink);}
  .bar .sub{font-size:12.5px;color:var(--ink-2);font-weight:600;}
  .bar .draft{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    background:var(--matcha);color:var(--charcoal);padding:4px 10px;border-radius:20px;}
  .bar a.home{font-size:13px;font-weight:700;color:var(--matcha-ink);text-decoration:none;}

  /* full-bleed slides that stack: each sticks under the bar and the next overlays it */
  .deck{display:block;}
  figure.slide{margin:0;width:100%;position:sticky;top:var(--bar-h);background:#d9d5cc;
    box-shadow:0 -14px 34px -12px rgba(20,22,28,.3);}
  figure.slide img{display:block;width:100%;height:auto;}
  figure.slide .n{position:absolute;top:16px;left:16px;font-size:11px;font-weight:800;color:#fff;
    background:rgba(30,29,27,.4);padding:3px 10px;border-radius:20px;letter-spacing:.03em;z-index:1;}

  /* outro */
  .end{scroll-snap-align:start;padding:70px 20px 90px;display:flex;flex-direction:column;align-items:center;gap:20px;}
  .end .card{max-width:640px;border:1.5px dashed var(--matcha);background:var(--matcha-tint);border-radius:16px;
    padding:22px;font-size:14.5px;color:var(--matcha-ink);text-align:center;line-height:1.55;}
  .end .card b{color:var(--charcoal);}
  .end .links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .end .links a{font-size:14px;font-weight:800;color:var(--charcoal);background:var(--matcha);text-decoration:none;
    padding:12px 20px;border-radius:100px;box-shadow:0 8px 18px -8px rgba(160,210,134,.7);}
  .end .links a.ghost{background:transparent;color:var(--matcha-ink);border:1.5px solid var(--matcha);box-shadow:none;}
</style>
</head>
<body>
  <div class="bar">
    <span class="mk"><svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M33 54 C26 41 29 20 46 8 C50 26 46 44 35.5 53 Z" fill="#a0d286"/>
      <path d="M35.6 51 C33.5 39 36 24 44.5 12.5" fill="none" stroke="#eaf5e2" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M32 52 C23 48 14.5 44 11 32.5 C23 32 30.5 39 34 50 Z" fill="#84bd67"/>
      <path d="M31 49 C24.5 45 19 42 13.5 36" fill="none" stroke="#eaf5e2" stroke-width="2.2" stroke-linecap="round"/>
    </svg></span>
    <span class="brand">Procras<span class="tea">tea</span></span>
    <span class="sub">Design process</span>
    <span class="draft">Working draft</span>
    <a class="home" href="../index.html" style="margin-left:14px;">← Home</a>
  </div>

  <div class="deck">
    <figure class="slide"><span class="n">01</span><img src="slides/slide-01.png" alt="Process — cover slide" loading="eager"></figure>
    <figure class="slide"><span class="n">02</span><img src="slides/slide-02.png" alt="Ideation with FigJam" loading="lazy"></figure>
    <figure class="slide"><span class="n">03</span><img src="slides/slide-03.png" alt="Market research with AI assist" loading="lazy"></figure>
    <figure class="slide"><span class="n">04</span><img src="slides/slide-04.jpg" alt="User personas (AI-generated)" loading="lazy"></figure>
    <figure class="slide"><span class="n">05</span><img src="slides/slide-05.png" alt="Information architecture (manual, FigJam)" loading="lazy"></figure>
    <figure class="slide"><span class="n">06</span><img src="slides/slide-06.png" alt="User journey (manual, FigJam)" loading="lazy"></figure>
  </div>

  <div class="end">
    <div class="card">✍️ <b>More slides on the way.</b> This is the deck so far — research synthesis, personas,
      IA &amp; user flow, wireframes, branding and the prototype are still being added.</div>
    <div class="links">
      <a href="../prototype/index.html">View the prototype →</a>
      <a class="ghost" href="../index.html">Back to home</a>
    </div>
  </div>

</body>
</html>
