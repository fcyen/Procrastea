<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procrastea — Design Process (case study)</title>
<meta name="description" content="Procrastea — the AI-assisted design process, as a scrollable slide deck.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --olive:#7c9458; --olive-d:#66794a; --ink:#1e1d1b; --beige:#d9d5cc; }
  *{box-sizing:border-box;} html,body{margin:0;}
  html{scroll-behavior:smooth;}
  body{background:#cfcabf;color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
    padding:12px 20px;background:rgba(207,202,191,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid #bcb7ac;}
  .bar .brand{font-weight:800;letter-spacing:-.01em;}
  .bar .brand .tea{color:var(--olive-d);}
  .bar .sub{font-size:12.5px;color:#6c6c66;font-weight:600;}
  .bar .draft{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
    background:var(--olive);color:#fff;padding:4px 10px;border-radius:20px;}
  .bar a.home{font-size:13px;font-weight:700;color:var(--olive-d);text-decoration:none;}

  .deck{max-width:1120px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px;}
  figure.slide{margin:0;position:relative;}
  figure.slide img{display:block;width:100%;height:auto;border-radius:14px;
    box-shadow:0 12px 34px -18px rgba(20,22,28,.5);background:var(--beige);}
  figure.slide .n{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;color:#fff;
    background:rgba(30,29,27,.45);padding:3px 9px;border-radius:20px;letter-spacing:.03em;}

  .end{max-width:1120px;margin:0 auto;padding:6px 16px 70px;text-align:center;color:#5f5f59;}
  .end .card{border:1.5px dashed var(--olive);background:rgba(124,148,88,.12);border-radius:16px;
    padding:22px;font-size:14px;color:var(--olive-d);}
  .end .card b{color:var(--ink);}
  .end .links{margin-top:16px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .end .links a{font-size:13px;font-weight:700;color:#fff;background:var(--olive);text-decoration:none;
    padding:10px 16px;border-radius:100px;}
  .end .links a.ghost{background:transparent;color:var(--olive-d);border:1.5px solid var(--olive);}
</style>
</head>
<body>
  <div class="bar">
    <span class="brand">Procras<span class="tea">tea</span></span>
    <span class="sub">Design process</span>
    <span class="draft">Working draft</span>
    <a class="home" href="../index.html" style="margin-left:14px;">← Home</a>
  </div>

  <div class="deck">
    <figure class="slide"><span class="n">01</span><img src="slides/slide-01.png" alt="Process — cover slide" loading="eager"></figure>
    <figure class="slide"><span class="n">02</span><img src="slides/slide-02.png" alt="Ideation with FigJam" loading="lazy"></figure>
    <figure class="slide"><span class="n">03</span><img src="slides/slide-03.png" alt="Market research with AI assist" loading="lazy"></figure>
  </div>

  <div class="end">
    <div class="card">✍️ <b>More slides on the way.</b> This is the deck so far — research synthesis, personas, IA &amp;
      user flow, wireframes, branding and the prototype are still being added.</div>
    <div class="links">
      <a href="../prototype/index.html">View the prototype →</a>
      <a class="ghost" href="../index.html">Back to home</a>
    </div>
  </div>
</body>
</html>
